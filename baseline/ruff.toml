# Ruff baseline for Python projects. Copy to the repo as ruff.toml (or into [tool.ruff] of pyproject.toml).
# Tier 1 (new code, e.g. linked-codebook): select = ["ALL"] with the ignores of linked-codebook/pyproject.toml.
# Tier 2 (legacy code, below): a curated set that finds real defects and dead code. Violations that cannot be
# fixed now go into `ignore` with a comment; remove entries as modules are cleaned up, never add new ones.
target-version = "py311"
line-length = 100

[lint]
select = [
  "E4", "E7", "E9", "F",   # pyflakes and syntax errors (unused names are the dead-code check)
  "I",                     # import order
  "UP",                    # modern annotations
  "B",                     # likely bugs (raise from, zip strict, mutable defaults)
  "SIM", "C4", "PERF",     # needless code
  "C90", "PLR09",          # complexity: branches, statements, arguments
  "ARG",                   # unused arguments
  "RUF", "ERA",            # misc, commented-out code
]
ignore = [
  # ratchet: remove when fixed
]

[lint.mccabe]
max-complexity = 12

[lint.per-file-ignores]
"tests/*" = ["ARG", "PLR09"]

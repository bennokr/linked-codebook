name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: make setup
      - name: Generated files are up to date
        run: |
          make generate
          git diff --exit-code
      - run: make lint
      - run: make test
      - run: make budget
      - run: make versions

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: make setup
      - run: npx playwright install --with-deps chromium
      - run: make smoke

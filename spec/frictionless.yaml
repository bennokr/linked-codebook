# How a profile is projected onto a Frictionless Table Schema (https://specs.frictionlessdata.io/table-schema/).
# Slots that have no place in the Table Schema are kept in one extension property, so that nothing is lost.
extension: x-linked-codebook
# Field slot -> Table Schema property, for slots that are copied as they are.
field: {name: name, label: title, description: description, datatype: type}
# Slots of a column that are kept in the extension property of the field.
extension_slots: [level, unit, unit_iri, variable, values, missing_range, mappings]
